server {
  listen 80;
  server_name _;

  # Statisches Blazor WASM Root
  root /usr/share/nginx/html;
  index index.html;

  # API Proxy (interner Docker-Hostname 'api')
  location /api/ {
    proxy_pass http://api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }

  # Langzeit-Caching für Framework Files
  location /_framework/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Service Worker immer frisch
  location = /service-worker.js {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Assets moderat cachen
  location ~* \.(dll|pdb|wasm|js|mjs|css|json|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
  }

  # SPA Fallback
  location / {
    try_files $uri /index.html;
  }
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}