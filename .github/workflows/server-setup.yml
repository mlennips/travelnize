name: Server Setup (Debian 12)

on:
  workflow_dispatch:

jobs:
  setup-server:
    runs-on: ubuntu-latest
    steps:
      - name: Remote Setup (Docker & rsync)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail

            echo "[1/6] Paketquellen aktualisieren + Basis-Tools"
            sudo apt-get update -y
            sudo apt-get install -y ca-certificates curl gnupg lsb-release rsync

            echo "[2/6] Docker GPG Key"
            sudo install -m 0755 -d /etc/apt/keyrings
            if [ ! -f /etc/apt/keyrings/docker.gpg ]; then
              curl -fsSL https://download.docker.com/linux/debian/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
            fi

            echo "[3/6] Docker Repository (Debian 12 / bookworm)"
            if [ ! -f /etc/apt/sources.list.d/docker.list ]; then
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable" | sudo tee /etc/apt/sources.list.d/docker.list >/dev/null
            fi
            sudo apt-get update -y

            echo "[4/6] Docker Engine + Plugins installieren/aktualisieren"
            sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

            echo "[5/6] Docker Dienst aktivieren"
            sudo systemctl enable docker
            sudo systemctl restart docker

            echo "[6/6] Benutzer zu Gruppe 'docker' hinzufügen (wirksam nach erneutem Login)"
            if getent group docker >/dev/null 2>&1; then
              sudo usermod -aG docker "$USER" || true
            fi

            echo "[Verify] Versionen:"
            docker --version || sudo docker --version
            docker compose version || echo "Compose Plugin unerwartet nicht verfügbar."

            echo "[Test] hello-world (optional)"
            sudo docker pull hello-world:latest
            sudo docker run --rm hello-world || echo "Warnung: Testlauf fehlgeschlagen."

            echo "Fertig. Nach erneutem SSH-Login ohne sudo 'docker' nutzbar."