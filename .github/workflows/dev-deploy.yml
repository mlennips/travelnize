name: DEV Deploy (Remote Build)

on:
  # push:
  #   branches: ["dev"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: (Optional) Show commit info
        run: echo "Deploying commit $GITHUB_SHA to DEV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Paket erstellen
        run: |
          tar czf app.tar.gz .

      - name: Upload Code
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "app.tar.gz"
          target: "/opt/travelnize"

      - name: Remote Entpacken & Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -e
            TARGET_DIR=/opt/travelnize
            mkdir -p "$TARGET_DIR"
            cd "$TARGET_DIR"
            tar xzf app.tar.gz
            # .env schreiben wie oben ...
            docker compose down
            docker compose up -d --build --remove-orphans
