name: DEV Deploy (Pull from GHCR)

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Image Tag (z.B. dev, sha-..., v1.2.3)"
        required: false
        default: "dev"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Commit Info
        run: echo "Deploying $GITHUB_SHA with image tag '${{ inputs.image_tag }}'"

      - name: Checkout (nur für Compose/Configs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archiv erstellen
        run: |
          tar czf deploy.tar.gz docker-compose.yml
          ls -lh deploy.tar.gz

      - name: Upload Compose/Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/opt/travelnize"

      - name: Remote Deploy (Pull aus GHCR)
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.DEV_SERVER_IP }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            set -euo pipefail
            TARGET_DIR=/opt/travelnize
            cd "$TARGET_DIR"

            echo "Entpacke aktualisierte Compose-Dateien..."
            tar xzf deploy.tar.gz || true

            echo "Schreibe .env..."
            cat > .env <<EOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            API_BASE_URL=${{ secrets.API_BASE_URL }}
            JWT_KEY=${{ secrets.JWT_KEY }}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            echo "Prüfe Docker/Podman..."
            docker --version || true
            if ! command -v docker >/dev/null 2>&1; then
              echo "docker nicht gefunden"; exit 1
            fi

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_TOKEN ist leer / Secret fehlt"; exit 1
            fi

            echo "Login bei GHCR (non-interactive)..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pull Images (Tag=${IMAGE_TAG})..."
            docker compose pull

            echo "Restart (ohne Rebuild)..."
            docker compose down
            docker compose up -d --remove-orphans

            echo "Aufräumen..."
            docker image prune -f

            echo "Status:"
            docker compose ps