name: Build and Deploy

on:
  workflow_dispatch:  # Ermöglicht das manuelle Auslösen des Workflows

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build

    - name: Test
      run: dotnet test --verbosity normal

    - name: Publish
      run: dotnet publish -c Release -o output

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4.6.2
      with:
        name: artifact  # Name des Artefakts
        path: output
        compression-level: 6
        overwrite: true

  deploy:
    runs-on: ubuntu-latest
    needs: build  # Der Deploy-Job benötigt den Build-Job

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v4
      with:
        name: artifact  # Name des Artefakts

    - name: Deploy to Server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        # Überprüfe, ob das Artefakt heruntergeladen wurde
        if [ -d output ]; then
            echo "output-Verzeichnis gefunden."
        else
            echo "output-Verzeichnis nicht gefunden."
            exit 1
        fi

        # Übertrage das output-Verzeichnis auf den vServer
        scp -r -i $SERVER_SSH_KEY -o StrictHostKeyChecking=no output $SERVER_USER@$SERVER_IP:/path/to/deploy

        # Führe die Anwendung auf dem Server aus
        ssh -i $SERVER_SSH_KEY -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd /path/to/deploy/output && dotnet YourProject.dll"
