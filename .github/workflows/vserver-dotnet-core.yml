name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    #needs: build  # Optional, um sicherzustellen, dass der Build erfolgreich war

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Build Artifact
      uses: actions/download-artifact@v3
      with:
        name: output

    - name: Deploy to Server
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
        SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
      run: |
        # Überprüfe den Inhalt des aktuellen Verzeichnisses
        ls -l
        
        # Überprüfe, ob die ZIP-Datei heruntergeladen wurde
        if [ -f deploy.zip ]; then
            echo "deploy.zip gefunden."
        else
            echo "deploy.zip nicht gefunden."
            exit 1
        fi
  
        # Übertrage die ZIP-Datei auf den vServer
        scp -i $SERVER_SSH_KEY -o StrictHostKeyChecking=no deploy.zip $SERVER_USER@$SERVER_IP:/
  
        # Entpacke die ZIP-Datei und führe die Anwendung aus
        ssh -i $SERVER_SSH_KEY -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "unzip -o /path/to/deploy/deploy.zip -d /path/to/deploy && cd /path/to/deploy && dotnet YourProject.dll"
