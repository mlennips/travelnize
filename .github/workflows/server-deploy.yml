name: Deploy (Pull from GHCR)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment-Umgebung (dev oder main)"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ github.event.inputs.environment == 'main' && 'latest' || 'dev' }}
      SERVER_IP: ${{ github.event.inputs.environment == 'main' && secrets.PROD_SERVER_IP || secrets.DEV_SERVER_IP }}
      SERVER_USER: ${{ github.event.inputs.environment == 'main' && secrets.PROD_SERVER_USER || secrets.DEV_SERVER_USER }}
      SERVER_SSH_KEY: ${{ github.event.inputs.environment == 'main' && secrets.PROD_SERVER_SSH_KEY || secrets.DEV_SERVER_SSH_KEY }}
      # Falls du für MAIN andere DB/API/JWT-Secrets brauchst, ergänze sie hier analog!
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      JWT_KEY: ${{ secrets.JWT_KEY }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GHCR_USERNAME: ${{ github.repository_owner }}

    steps:
      - name: Commit Info
        run: |
          echo "Deploying $GITHUB_SHA to '${{ github.event.inputs.environment }}' with image tag '${IMAGE_TAG}'"

      - name: Checkout (nur für Compose/Configs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Archiv erstellen
        run: |
          tar czf deploy.tar.gz docker-compose.yml
          ls -lh deploy.tar.gz

      - name: Upload Compose/Config
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          source: "deploy.tar.gz"
          target: "/opt/travelnize"

      - name: Remote Deploy (Pull aus GHCR)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          envs: IMAGE_TAG,GHCR_TOKEN,GHCR_USERNAME,POSTGRES_USER,POSTGRES_PASSWORD,POSTGRES_DB,API_BASE_URL,JWT_KEY
          script: |
            set -euo pipefail
            TARGET_DIR=/opt/travelnize
            cd "$TARGET_DIR"

            echo "Entpacke aktualisierte Compose-Dateien..."
            tar xzf deploy.tar.gz || true

            echo "Schreibe .env..."
            cat > .env <<EOF
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            POSTGRES_DB=${POSTGRES_DB}
            API_BASE_URL=${API_BASE_URL}
            JWT_KEY=${JWT_KEY}
            IMAGE_TAG=${IMAGE_TAG}
            EOF

            echo "Prüfe Docker..."
            docker --version || true
            command -v docker >/dev/null || { echo 'docker nicht gefunden'; exit 1; }

            if [ -z "${GHCR_TOKEN:-}" ]; then
              echo "ERROR: GHCR_TOKEN ist leer"; exit 1
            fi
            if [ -z "${GHCR_USERNAME:-}" ]; then
              echo "ERROR: GHCR_USERNAME ist leer"; exit 1
            fi

            echo "Login bei GHCR..."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            echo "Pull Images (Tag=${IMAGE_TAG})..."
            docker compose pull

            echo "Restart..."
            docker compose down
            docker compose up -d --remove-orphans

            echo "Aufräumen..."
            docker image prune -f || true

            echo "Status:"
            docker compose ps